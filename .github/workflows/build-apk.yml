name: Build Wasil Messenger APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Live HTTPS App URL to package inside APK'
        required: false
        default: 'https://wasil-messenger.vercel.app'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      WASIL_APP_URL: ${{ github.event.inputs.app_url || 'https://wasil-messenger.vercel.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -f cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Gradle Wrapper for Wasil Android project
        run: |
          set -e
          if [ -f "android/build.gradle" ]; then
            PROJECT_DIR="android"
          elif [ -f "build.gradle" ]; then
            PROJECT_DIR="."
          else
            echo "Android project directory not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build Debug & Release APKs
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug assembleRelease --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/*.apk ../dist-apk/wasil-messenger-debug.apk
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk ../dist-apk/wasil-messenger-release.apk
          fi
          
          # Optional: Verify APK signature using Android build-tools apksigner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signatures with $APKSIGNER..."
            "$APKSIGNER" verify --verbose ../dist-apk/wasil-messenger-debug.apk || true
            if [ -f "../dist-apk/wasil-messenger-release.apk" ]; then
              "$APKSIGNER" verify --verbose ../dist-apk/wasil-messenger-release.apk || true
            fi
          fi

          printf '%s\n' \
            'Wasil Messenger APK Installation Guide:' \
            '=======================================' \
            '1. To avoid "App not installed" (التطبيق ليس مثبتاً):' \
            '   - Uninstall any older version of Wasil Messenger / WhatsApp clone currently on your phone.' \
            '   - Install "wasil-messenger-release.apk" or "wasil-messenger-debug.apk".' \
            '2. If Google Play Protect shows a prompt:' \
            '   - Tap "More details" (مزيد من التفاصيل).' \
            '   - Tap "Install anyway" (تثبيت على أي حال).' \
            '3. Ensure your File Manager has permission to "Install Unknown Apps" in phone settings.' \
            > ../dist-apk/INSTALLATION_GUIDE.txt

      - name: Upload Wasil APK Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wasil-messenger-apk
          path: dist-apk/*
          if-no-files-found: error
