plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wasil.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "com.wasil.messenger"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        resValue "string", "wasil_app_url", System.getenv("WASIL_APP_URL") ?: "https://wasil-messenger.vercel.app"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
